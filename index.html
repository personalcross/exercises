<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

    <title>Exercícios | EPC</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="shortcut icon" href="https://personalcross.github.io/assets/favicon/favicon.png">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/variables.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/global-style.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/custom-header.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/custom-nav.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/hamburger.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/settings.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/toolbar.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/switches-container.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/list.css">
    <link rel="stylesheet" href="https://personalcross.github.io/assets/components/modal.css">
    <link rel="stylesheet" href="./style.css">

    <!-- must be the last one -->
    <link rel="stylesheet" href="https://personalcross.github.io/assets/responsive.css">
</head>

<body>
    <header class="custom-header">
        <nav class="custom-nav">
            <button class="hamburger" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <span class="custom-nav-links">
                <a href="https://personalcross.github.io/home">Home</a>
                <a href="https://personalcross.github.io/checkin">Check-in</a>
                <a href="https://personalcross.github.io/modalities">Modalidades</a>
                <a href="https://personalcross.github.io/nosso-time/">Nosso Time</a>
                <a href="https://personalcross.github.io/perguntas-frequentes/">Perguntas Frequentes</a>
                <a href="https://personalcross.github.io/sobre/">Sobre</a>
            </span>
            <img class="settings-icon" src="https://personalcross.github.io/assets/store/settings.png" alt="settings"
                width="10%">
        </nav>
    </header>

    <main>
        <aside class="settings-sidebar">
            <button class="close-settings">X</button>
            <div class="settings-options">
                <button id="btn-login" class="guest-only">Entrar</button>
                <button id="btn-signup" class="guest-only">Registrar</button>

                <button id="btn-gym" class="admin-only">Academia</button>
                <button id="btn-customers" class="admin-only">Clientes</button>
                <button id="btn-exercises" class="admin-only">Exercícios</button>
                <button id="btn-prescriptions" class="admin-only">Prescrições</button>
                <button id="btn-workouts" class="admin-only">Treinos</button>

                <hr class="admin-only" />
                <button id="btn-manage-accounts" class="admin-only">Gestão de Contas</button>
                <button id="btn-logout" class="logged-only">Sair</button>
            </div>
        </aside>

        <section class="toolbar">
            <div class="search-bar">
                <img src="https://personalcross.github.io/assets/store/magnifier.png" alt="Pesquisar">

                <input type="search" id="exercise-search" placeholder="Pesquisar exercício por nome..."
                    aria-label="Pesquisar exercício por nome">
            </div>
            <button id="btn-add-exercise" class="add-button">
                <img src="https://personalcross.github.io/assets/store/add.png" alt="">
            </button>
        </section>

        <section>
            <h2 class="section-title">
                Exercícios
            </h2>
            <div id="exercise-list" class="list">
                <p class="list-message">
                    A carregar exercícios...
                </p>
            </div>
        </section>

        <!-- EXERCISE MODAL -->
        <div id="exercise-modal" class="modal">
            <div class="modal-content">
                <h2 id="exercise-modal-title">
                    Adicionar exercício
                </h2>

                <form id="exercise-form">
                    <input type="hidden" id="exercise-document-id">

                    <div class="input-field">
                        <input type="text" id="exercise-name" required>
                        <label for="exercise-name">Nome</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-type" required>
                            <option value="" disabled selected>Selecione o tipo</option>
                            <option value="body weight">Peso corporal</option>
                            <option value="free weight">Peso livre</option>
                            <option value="machine weight">Máquina</option>
                            <option value="aerobic exercise">Exercício aeróbico</option>
                            <option value="high intensity interval training">HIIT</option>
                            <option value="mind body exercise">Mind-body</option>
                        </select>
                        <label>Tipo de exercício</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-complexity" required>
                            <option value="" disabled selected>Selecione a complexidade</option>
                            <option value="fácil">Fácil</option>
                            <option value="médio">Médio</option>
                            <option value="difícil">Difícil</option>
                            <option value="muito difícil">Muito difícil</option>
                        </select>
                        <label>Complexidade</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-external-load" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="calorie">Calorias</option>
                            <option value="speed">Velocidade</option>
                            <option value="distance">Distância</option>
                            <option value="interval">Intervalo</option>
                            <option value="reps">Repetições</option>
                            <option value="time">Tempo</option>
                            <option value="watt">Potência (W)</option>
                            <option value="revolution">Rotações</option>
                            <option value="stroke">Remadas</option>
                            <option value="weight">Peso</option>
                        </select>
                        <label>Tipo de carga</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-agonist" multiple>
                            <!-- populated by JS -->
                        </select>
                        <label>Músculos agonistas</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-synergist" multiple>
                            <!-- populated by JS -->
                        </select>
                        <label>Músculos sinergistas</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-antagonist" multiple>
                            <!-- populated by JS -->
                        </select>
                        <label>Músculos antagonistas</label>
                    </div>

                    <div class="input-field">
                        <select id="exercise-equipment" multiple>
                            <!-- populated by JS -->
                        </select>
                        <label>Equipamentos</label>
                    </div>

                    <div class="input-field">
                        <input type="url" id="exercise-url">
                        <label for="exercise-url">Vídeo demonstrativo</label>
                    </div>

                    <div class="input-field">
                        <textarea id="exercise-notes" class="materialize-textarea"></textarea>
                        <label for="exercise-notes">Observações</label>
                    </div>

                    <div class="switches-container">
                        <div class="switch-field">
                            <div class="switch">
                                <label>
                                    Inativo
                                    <input type="checkbox" id="exercise-is-active" checked>
                                    <span class="lever"></span>
                                    Ativo
                                </label>
                            </div>
                        </div>
                        <div class="switch-field">
                            <div class="switch">
                                <label>
                                    Monoarticular
                                    <input type="checkbox" id="exercise-is-multijoint">
                                    <span class="lever"></span>
                                    Multiarticular
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="btn-cancel-exercise" class="cancel-button">
                            Cancelar
                        </button>

                        <button type="submit" id="btn-save-exercise" class="confirm-button">
                            Salvar
                        </button>

                        <button type="button" id="btn-close-exercise" class="confirm-button">
                            Fechar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <footer>
        <div class="highlight">
            <div class="highlight-logo">
                <div>
                    <a href="#">
                        <img src="https://personalcross.github.io/assets/store/epc-logo.png" alt="logo">
                    </a>
                </div>
            </div>
            <div class="highlight-social">
                <p>Siga-nos:</p>
                <div class="social-links">
                    <a href="https://www.instagram.com/ep.cross?igsi=NGg0cnl1aTFvYTFr" aria-label="Instagram"
                        target="_blank" rel="noopener noreferrer">
                        <img src="https://www.vectorlogo.zone/logos/instagram/instagram-tile.svg" alt="instagram">
                    </a>
                    <a href="https://www.instagram.com/ep.cross?igsi=NGg0cnl1aTFvYTFr" aria-label="LinkedIn"
                        target="_blank" rel="noopener noreferrer">
                        <img src="https://www.vectorlogo.zone/logos/linkedin/linkedin-tile.svg" alt="linkedin">
                    </a>
                </div>
            </div>
        </div>
        <div class="copyright">
            © <span id="current-year"></span> Estúdio Personal Cross · Todos os direitos reservados
        </div>
    </footer>

    <script src="cs.js"></script>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="hamburgerui.js"></script>
    <script src="sidebarui.js"></script>
    <script src="auth.js"></script>
    <script src="time.js"></script>
    <script src="fill.js"></script>
    <script src="modal.js"></script>
    <script src="list.js"></script>
</body>

</html>
